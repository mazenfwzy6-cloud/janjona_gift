<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZEN & JANA // الحب جاني — حكايتنا بالأنمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #09070e;
            color: #f4f0ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, #27113b 0%, #0e0917 62%, #07050b 100%);
            z-index: -2;
        }

        .audio-btn {
            position: fixed;
            top: 14px;
            left: 14px;
            background: rgba(20, 14, 32, 0.92);
            color: #ff7eb6;
            border: 1px solid rgba(255, 126, 182, 0.45);
            border-radius: 50px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .card {
            width: 100%;
            max-width: 690px;
            background: rgba(18, 13, 29, 0.92);
            border: 1.5px solid rgba(255, 105, 180, 0.35);
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.78), 0 0 42px rgba(255, 65, 108, 0.16);
            border-radius: 26px;
            padding: 20px 18px 22px;
            backdrop-filter: blur(16px);
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #ff85c0;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .progress-fill {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, #ff416c, #ff85c0, #9d4edd);
            transition: width 0.4s ease;
        }

        .anime-viewport {
            width: 100%;
            height: 295px;
            border-radius: 20px;
            overflow: hidden;
            border: 1.5px solid rgba(255, 133, 192, 0.28);
            background: #130b21;
            margin-bottom: 16px;
            position: relative;
            box-shadow: inset 0 0 32px rgba(0,0,0,0.65);
        }

        .scene-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* حركات الشخصيات والأرجل والذراع والموبايل */
        .walk-left {
            animation: walkCycleL 1.1s ease-in-out infinite;
            transform-origin: center bottom;
        }
        .walk-right {
            animation: walkCycleR 1.1s ease-in-out infinite;
            transform-origin: center bottom;
        }
        @keyframes walkCycleL {
            0%, 100% { transform: rotate(-16deg); }
            50% { transform: rotate(16deg); }
        }
        @keyframes walkCycleR {
            0%, 100% { transform: rotate(16deg); }
            50% { transform: rotate(-16deg); }
        }

        .phone-arm {
            transform-origin: 45px 82px;
            animation: checkPhone 1.7s ease-in-out infinite;
        }
        @keyframes checkPhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-18deg) translateY(-3px); }
        }

        .chat-pop {
            animation: chatSlideIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes chatSlideIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .talk-jaw {
            animation: talkAnim 0.45s ease-in-out infinite alternate;
            transform-origin: center;
        }
        @keyframes talkAnim {
            0% { transform: scaleY(0.75); }
            100% { transform: scaleY(1.35); }
        }

        .road-move {
            animation: streetScroll 1.3s linear infinite;
        }
        @keyframes streetScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(90px); }
        }

        .bus-bounce {
            animation: busRide 0.65s ease-in-out infinite;
        }
        @keyframes busRide {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2.5px); }
        }

        .heart-pulse {
            transform-origin: center;
            animation: hBeat 1.25s ease-in-out infinite;
        }
        @keyframes hBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.24); }
        }

        .slide-title {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #ffb3d9;
            margin-bottom: 8px;
        }

        .slide-text {
            min-height: 105px;
            text-align: center;
            font-size: 16.5px;
            line-height: 1.85;
            color: #f7f4ff;
            font-weight: 600;
            padding: 0 6px;
            margin-bottom: 14px;
        }

        .counter-panel {
            display: none;
            background: rgba(255, 105, 180, 0.09);
            border: 1px solid rgba(255, 105, 180, 0.35);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .counter-panel.active { display: block; }
        .counter-title {
            text-align: center;
            font-size: 13px;
            color: #ff99cc;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .counter-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .c-box {
            background: rgba(10, 7, 16, 0.82);
            border: 1px solid rgba(255, 133, 192, 0.25);
            border-radius: 12px;
            padding: 7px 4px;
            text-align: center;
        }
        .c-box span {
            display: block;
            font-size: 20px;
            font-weight: 900;
            color: #ff7eb6;
        }
        .c-box small {
            font-size: 11px;
            color: #c9c2dc;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #ff416c, #ff5e62);
            color: #fff;
            border: none;
            padding: 12px 26px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(255, 65, 108, 0.4);
            transition: 0.25s;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.03);
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-prev {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <audio id="bgm" src="song.mp3" autoplay loop preload="auto"></audio>
    <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🔊 الصوت شغال</button>

    <div class="bg-glow"></div>

    <div class="card">
        <div class="header-meta">
            <span id="sceneBadge">مشهد 1 // جامعة برج العرب التكنولوجية</span>
            <span id="slideNum">1 / 20</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="anime-viewport" id="animeViewport"></div>

        <h2 class="slide-title" id="slideTitle"></h2>
        <div class="slide-text" id="slideText"></div>

        <div class="counter-panel" id="counterPanel">
            <div class="counter-title">من يوم 16 يوليو 2026 — وأنا معاكي في كل لحظة ❤️</div>
            <div class="counter-row">
                <div class="c-box"><span id="d">00</span><small>يوم</small></div>
                <div class="c-box"><span id="h">00</span><small>ساعة</small></div>
                <div class="c-box"><span id="m">00</span><small>دقيقة</small></div>
                <div class="c-box"><span id="s">00</span><small>ثانية</small></div>
            </div>
        </div>

        <div class="nav-row">
            <button class="btn btn-prev" id="prevBtn" onclick="goPrev()">السابق</button>
            <button class="btn" id="nextBtn" onclick="goNext()">التالي ✨</button>
        </div>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const audioBtn = document.getElementById('audioBtn');
        let mutedByUser = false;

        function updateAudioLabel() {
            audioBtn.innerText = (!bgm.paused && !bgm.muted) ? '🔊 الصوت شغال' : '🔇 شغل الصوت';
        }
        function playBgm() {
            if (!bgm || mutedByUser) return;
            bgm.muted = false;
            bgm.play().then(updateAudioLabel).catch(updateAudioLabel);
        }
        function toggleAudio() {
            if (bgm.paused || bgm.muted) {
                mutedByUser = false;
                bgm.muted = false;
                bgm.play().then(updateAudioLabel).catch(updateAudioLabel);
            } else {
                mutedByUser = true;
                bgm.pause();
                updateAudioLabel();
            }
        }
        window.addEventListener('DOMContentLoaded', playBgm);
        window.addEventListener('load', playBgm);
        ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(e => document.addEventListener(e, playBgm, { once: true }));

        /* شخصية الولد (مازن) بحركات أرجل وموبايل وتفاعل */
        function boyChar(x, y, opts = {}) {
            const {
                look = "right",
                walking = false,
                holdingPhone = false,
                talking = false,
                smile = true
            } = opts;

            const dx = look === "right" ? 2.5 : (look === "left" ? -2.5 : 0);
            const legL = walking ? "walk-left" : "";
            const legR = walking ? "walk-right" : "";
            const mouth = talking
                ? `<ellipse cx="35" cy="54" rx="4" ry="3.2" fill="#9e3b52" class="talk-jaw"/>`
                : (smile
                    ? `<path d="M29 53 Q35 58 41 53" stroke="#b56576" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
                    : `<line x1="31" y1="54" x2="39" y2="54" stroke="#b56576" stroke-width="2" stroke-linecap="round"/>`);

            const phoneGroup = holdingPhone ? `
                <g class="phone-arm">
                    <!-- ذراع ماسك الفون -->
                    <path d="M48 82 L64 62" stroke="#ffd6ba" stroke-width="7" stroke-linecap="round"/>
                    <!-- الموبايل -->
                    <rect x="60" y="38" width="18" height="30" rx="4" fill="#10131d" stroke="#5cf2b6" stroke-width="1.6"/>
                    <rect x="63" y="42" width="12" height="20" rx="2" fill="#25D366" opacity="0.85"/>
                </g>
            ` : `
                <path d="M16 82 L10 106" stroke="#ffd6ba" stroke-width="6.5" stroke-linecap="round"/>
                <path d="M54 82 L60 106" stroke="#ffd6ba" stroke-width="6.5" stroke-linecap="round"/>
            `;

            return `
            <g transform="translate(${x}, ${y})">
                <!-- أرجل متحركة -->
                <g class="${legL}">
                    <rect x="21" y="114" width="9" height="34" rx="4" fill="#221a3b"/>
                    <rect x="19" y="143" width="14" height="7" rx="3" fill="#ff7eb6"/>
                </g>
                <g class="${legR}">
                    <rect x="40" y="114" width="9" height="34" rx="4" fill="#1b1430"/>
                    <rect x="39" y="143" width="14" height="7" rx="3" fill="#ff7eb6"/>
                </g>
                <!-- جسم وجاكت -->
                <path d="M14 78 Q35 67 56 78 L60 118 L10 118 Z" fill="#1e1638" stroke="#ff7eb6" stroke-width="1.6"/>
                <polygon points="35,75 27,98 43,98" fill="#ff416c"/>
                ${phoneGroup}
                <!-- رقبة ورأس -->
                <rect x="29" y="60" width="12" height="15" rx="5" fill="#ffd6ba"/>
                <ellipse cx="35" cy="41" rx="22" ry="24" fill="#ffe0c8"/>
                <!-- شعر قصير أنيق بدون لحية أو شارب -->
                <path d="M12 37 Q15 12 36 12 Q56 12 58 37 Q50 24 35 27 Q20 24 12 37 Z" fill="#140e24"/>
                <!-- عيون -->
                <circle cx="${27 + dx}" cy="43" r="3.4" fill="#140e24"/>
                <circle cx="${43 + dx}" cy="43" r="3.4" fill="#140e24"/>
                <circle cx="${28 + dx}" cy="42" r="1.3" fill="#fff"/>
                <circle cx="${44 + dx}" cy="42" r="1.3" fill="#fff"/>
                ${mouth}
            </g>`;
        }

        /* شخصية البنت (چنى) بحركات أرجل والتفاتة وابتسامة */
        function girlChar(x, y, opts = {}) {
            const {
                look = "away",
                walking = false,
                blush = false,
                smile = true,
                talking = false
            } = opts;

            const dx = look === "left" ? -2.5 : (look === "right" ? 2.5 : 2.2);
            const legL = walking ? "walk-left" : "";
            const legR = walking ? "walk-right" : "";
            const blushHtml = blush
                ? `<ellipse cx="23" cy="49" rx="4.5" ry="2.3" fill="#ff758f" opacity="0.7"/>
                   <ellipse cx="47" cy="49" rx="4.5" ry="2.3" fill="#ff758f" opacity="0.7"/>`
                : ``;
            const mouth = talking
                ? `<ellipse cx="35" cy="54" rx="3.8" ry="3" fill="#b83b65" class="talk-jaw"/>`
                : (smile
                    ? `<path d="M30 53 Q35 58 40 53" stroke="#c94a7c" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
                    : `<line x1="31" y1="54" x2="39" y2="54" stroke="#c94a7c" stroke-width="2" stroke-linecap="round"/>`);

            return `
            <g transform="translate(${x}, ${y})">
                <!-- شعر طويل -->
                <path d="M12 33 Q6 96 15 138 L55 138 Q64 96 58 33 Z" fill="#3b185f"/>
                <!-- أرجل متحركة -->
                <g class="${legL}">
                    <rect x="22" y="114" width="8.5" height="34" rx="4" fill="#2d1747"/>
                    <rect x="20" y="143" width="13" height="7" rx="3" fill="#ffc2d4"/>
                </g>
                <g class="${legR}">
                    <rect x="39" y="114" width="8.5" height="34" rx="4" fill="#231138"/>
                    <rect x="38" y="143" width="13" height="7" rx="3" fill="#ffc2d4"/>
                </g>
                <!-- جسم -->
                <path d="M15 78 Q35 68 55 78 L59 118 L11 118 Z" fill="#ff5d8f" stroke="#ffc2d4" stroke-width="1.5"/>
                <!-- ذراعان -->
                <path d="M17 82 L11 105" stroke="#ffe2d1" stroke-width="6" stroke-linecap="round"/>
                <path d="M53 82 L59 105" stroke="#ffe2d1" stroke-width="6" stroke-linecap="round"/>
                <!-- رقبة ورأس -->
                <rect x="30" y="60" width="11" height="15" rx="5" fill="#ffe2d1"/>
                <ellipse cx="35" cy="42" rx="21" ry="23" fill="#ffeadb"/>
                <!-- غرة -->
                <path d="M13 38 Q17 14 35 14 Q53 14 57 38 Q46 27 35 30 Q24 27 13 38 Z" fill="#4f227d"/>
                ${blushHtml}
                <!-- عيون -->
                <circle cx="${27 + dx}" cy="43" r="3.4" fill="#231942"/>
                <circle cx="${43 + dx}" cy="43" r="3.4" fill="#231942"/>
                <circle cx="${28 + dx}" cy="42" r="1.3" fill="#fff"/>
                <circle cx="${44 + dx}" cy="42" r="1.3" fill="#fff"/>
                ${mouth}
            </g>`;
        }

        /* فقاعات رسايل واتساب الحقيقية جنب الشخصيات */
        function chatBubblesSVG(messages) {
            return messages.map((m, idx) => {
                const isMe = m.from === "me";
                const x = isMe ? 155 : 325;
                const y = 32 + idx * 54;
                const bg = isMe ? "#1f5c3e" : "#2b1d4a";
                const border = isMe ? "#25D366" : "#ff85c0";
                const label = isMe ? "ميزو" : "jana ayman";
                return `
                <g class="chat-pop" style="animation-delay:${idx * 0.16}s">
                    <rect x="${x}" y="${y}" width="195" height="44" rx="12" fill="${bg}" stroke="${border}" stroke-width="1.5"/>
                    <text x="${x + 185}" y="${y + 16}" text-anchor="end" fill="#b7ffd8" font-size="10.5" font-weight="800">${label} • ${m.time}</text>
                    <text x="${x + 185}" y="${y + 34}" text-anchor="end" fill="#ffffff" font-size="12" font-weight="700">${m.text}</text>
                </g>`;
            }).join("");
        }

        function buildScene(type, chatList = []) {
            if (type === "gate_exit") {
                return `
                <svg class="scene-svg" viewBox="0 0 660 295" xmlns="http://www.w3.org/2000/svg">
                    <rect width="660" height="295" fill="#150d26"/>
                    <!-- مبنى جامعة برج العرب التكنولوجية -->
                    <rect x="295" y="24" width="335" height="185" rx="10" fill="#23163d" stroke="#ff85c0" stroke-width="1.5"/>
                    <rect x="315" y="10" width="295" height="32" rx="8" fill="#ff416c" stroke="#ffd6e7" stroke-width="1.4"/>
                    <text x="462" y="31" text-anchor="middle" fill="#fff" font-size="14.5" font-weight="900">جامعة برج العرب التكنولوجية</text>
                    <!-- شبابيك وبوابة خروج -->
                    <g fill="#ffd166" opacity="0.5">
                        <rect x="330" y="58" width="34" height="22" rx="3"/><rect x="380" y="58" width="34" height="22" rx="3"/>
                        <rect x="505" y="58" width="34" height="22" rx="3"/><rect x="555" y="58" width="34" height="22" rx="3"/>
                    </g>
                    <rect x="425" y="122" width="74" height="87" rx="6" fill="#120921" stroke="#ff85c0"/>
                    <!-- أرضية -->
                    <rect x="0" y="232" width="660" height="63" fill="#10091c"/>
                    <!-- الولد واقف بره وبيبص عليها وهي خارجة -->
                    <text x="155" y="76" font-size="22" class="heart-pulse">👀💘</text>
                    ${boyChar(120, 88, { look: "right", smile: true })}
                    ${girlChar(435, 90, { look: "away", walking: true, smile: true })}
                </svg>`;
            }

            if (type === "lecture_friends") {
                return `
                <svg class="scene-svg" viewBox="0 0 660 295" xmlns="http://www.w3.org/2000/svg">
                    <rect width="660" height="295" fill="#171029"/>
                    <!-- سبورة المحاضرة -->
                    <rect x="155" y="14" width="350" height="72" rx="8" fill="#15382c" stroke="#c77dff" stroke-width="1.8"/>
                    <text x="330" y="45" text-anchor="middle" fill="#b4ffe0" font-size="14" font-weight="800">المحاضرة — جامعة برج العرب التكنولوجية</text>
                    <text x="330" y="68" text-anchor="middle" fill="#80ed99" font-size="11.5">الولد باصص عليها وهي وسط صحابها مش باصاله</text>

                    <!-- خط نظرات الولد رايح ناحيتها -->
                    <line x1="175" y1="138" x2="405" y2="138" stroke="#ff7eb6" stroke-width="2" stroke-dasharray="6,5"/>
                    <text x="285" y="128" text-anchor="middle" font-size="17" class="heart-pulse">👀</text>

                    <!-- الولد قاعد وبيبص عليها -->
                    ${boyChar(110, 95, { look: "right", smile: true })}

                    <!-- صاحباتها قاعدين جنبها -->
                    <g opacity="0.72" transform="translate(365, 102)">
                        <circle cx="24" cy="36" r="18" fill="#9d8df1"/>
                        <path d="M6 115 Q24 64 42 115 Z" fill="#5e548e"/>
                    </g>
                    ${girlChar(428, 95, { look: "away", smile: false })}
                    <g opacity="0.72" transform="translate(495, 102)">
                        <circle cx="24" cy="36" r="18" fill="#b8b8ff"/>
                        <path d="M6 115 Q24 64 42 115 Z" fill="#4a4e69"/>
                    </g>

                    <!-- بنشات -->
                    <rect x="85" y="238" width="160" height="57" rx="6" fill="#2c1b45" stroke="#ff85c0" stroke-width="1.2"/>
                    <rect x="355" y="238" width="235" height="57" rx="6" fill="#2c1b45" stroke="#ff85c0" stroke-width="1.2"/>
                </svg>`;
            }

            if (type === "whatsapp_chat") {
                return `
                <svg class="scene-svg" viewBox="0 0 660 295" xmlns="http://www.w3.org/2000/svg">
                    <rect width="660" height="295" fill="#120c21"/>
                    <!-- الولد ماسك الفون -->
                    ${boyChar(55, 96, { look: "right", holdingPhone: true, smile: true })}
                    <!-- فقاعات الشات الحقيقية في النص -->
                    ${chatBubblesSVG(chatList)}
                    <!-- البنت على اليمين -->
                    ${girlChar(545, 96, { look: "left", smile: false })}
                    <rect x="0" y="242" width="660" height="53" fill="#0c0717"/>
                </svg>`;
            }

            if (type === "together_love") {
                return `
                <svg class="scene-svg" viewBox="0 0 660 295" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="lovGrad" cx="50%" cy="50%" r="60%">
                            <stop offset="0%" stop-color="#4c154d"/>
                            <stop offset="100%" stop-color="#120a20"/>
                        </radialGradient>
                    </defs>
                    <rect width="660" height="295" fill="url(#lovGrad)"/>
                    <text x="330" y="42" text-anchor="middle" fill="#ffd6e7" font-size="16" font-weight="900">16 يوليو 2026 — لما قربنا وحبينا بعض ❤️</text>
                    <text x="330" y="88" text-anchor="middle" font-size="32" class="heart-pulse">💖</text>
                    ${boyChar(240, 98, { look: "right", smile: true })}
                    ${girlChar(355, 98, { look: "left", blush: true, smile: true })}
                    <rect x="0" y="244" width="660" height="51" fill="#0e071a"/>
                </svg>`;
            }

            /* مشهد العربية المليانة ناس وهما جنب بعض وبيتكلموا */
            return `
            <svg class="scene-svg" viewBox="0 0 660 295" xmlns="http://www.w3.org/2000/svg">
                <rect width="660" height="295" fill="#0f172a"/>
                <!-- الشارع المتحرك بره -->
                <g class="road-move" opacity="0.45">
                    <circle cx="95" cy="52" r="14" fill="#ffd166"/>
                    <rect x="180" y="65" width="65" height="90" fill="#233554"/>
                    <rect x="370" y="55" width="75" height="100" fill="#1d2d44"/>
                    <rect x="550" y="70" width="65" height="85" fill="#233554"/>
                </g>
                <g class="bus-bounce">
